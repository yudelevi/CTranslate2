name: aarch64 CUDA wheel

on:
  push:
    branches: [aarch64-cuda]
    paths:
      - '.github/workflows/aarch64-cuda-wheel.yml'
      - 'python/ctranslate2/version.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  CUDA_ARCH_LIST: "9.0"
  PYTHON_VERSIONS: "3.14 3.15"

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35, matches boxes still on Ubuntu 22.04
          - runner: ubuntu-22.04-arm
            cuda_repo: ubuntu2204
            plat: manylinux_2_35_aarch64
          # glibc 2.39, for boxes on Ubuntu 24.04
          - runner: ubuntu-24.04-arm
            cuda_repo: ubuntu2404
            plat: manylinux_2_39_aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.14
            3.15
          allow-prereleases: true

      - name: Install CUDA and OpenBLAS
        run: |
          curl -fsSL -O https://developer.download.nvidia.com/compute/cuda/repos/${{ matrix.cuda_repo }}/sbsa/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-8 cuda-cudart-dev-12-8 libcublas-dev-12-8 libcurand-dev-12-8 \
            libopenblas-dev
          echo "/usr/local/cuda-12.8/bin" >> "$GITHUB_PATH"

      - name: Build libctranslate2
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_CLI=OFF \
            -DWITH_MKL=OFF -DWITH_OPENBLAS=ON -DWITH_RUY=ON -DOPENMP_RUNTIME=COMP \
            -DWITH_CUDA=ON -DWITH_CUDNN=OFF -DCUDA_DYNAMIC_LOADING=ON \
            -DCUDA_NVCC_FLAGS="-Xfatbin=-compress-all" \
            -DCUDA_ARCH_LIST="${CUDA_ARCH_LIST}"
          cmake --build build -j"$(nproc)"
          sudo cmake --install build
          sudo ldconfig

      - name: Build wheels
        working-directory: python
        run: |
          # pip wheel leaves libctranslate2 out of the wheel; bundle it, but keep the
          # CUDA libraries external since they are dlopened and already on the target box.
          for py in ${PYTHON_VERSIONS}; do
            "python${py}" -m pip install -r install_requirements.txt auditwheel "patchelf>=0.17"
            rm -rf build dist
            "python${py}" -m pip wheel . --no-deps -w dist
            "python${py}" -m auditwheel repair dist/*.whl --plat ${{ matrix.plat }} -w wheelhouse \
              --exclude libcudart.so.12 \
              --exclude libcublas.so.12 \
              --exclude libcublasLt.so.12 \
              --exclude libcurand.so.10
          done

      - name: Verify CUDA is compiled in
        run: |
          python - <<'PY'
          import glob, os, zipfile
          wheels = sorted(glob.glob("python/wheelhouse/*.whl"))
          for tag in ("cp" + v.replace(".", "") for v in os.environ["PYTHON_VERSIONS"].split()):
              assert any(f"-{tag}-{tag}-" in w for w in wheels), f"no {tag} wheel"
          for whl in wheels:
              zf = zipfile.ZipFile(whl)
              libs = [n for n in zf.namelist() if n.endswith(".so") or ".so." in n]
              print(whl)
              for n in libs:
                  print("   ", n, zf.getinfo(n).file_size)
              assert any("libctranslate2" in n for n in libs), "libctranslate2 not bundled"
              blob = b"".join(zf.read(n) for n in libs)
              assert b"libcublas.so.12" in blob, "no cuBLAS reference: built without CUDA"
          print("OK: libctranslate2 bundled, cuBLAS 12 reference present")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "exec(open('python/ctranslate2/version.py').read()); print(__version__)")
          tag="v${version}-aarch64-cu128-${GITHUB_RUN_NUMBER}"
          # One release per run holds both glibc variants; whichever job gets
          # there first creates the tag and the other uploads alongside it.
          gh release create "$tag" --title "CTranslate2 ${version} aarch64 + CUDA 12.8" \
            --notes "Unofficial aarch64 wheels, WITH_CUDA=ON, sbsa CUDA 12.8, CUDA_ARCH_LIST=${CUDA_ARCH_LIST}, dynamic loading. Upstream PyPI aarch64 wheels are CPU-only. Built for glibc 2.35 (Ubuntu 22.04) and glibc 2.39 (Ubuntu 24.04). Each build publishes a new tag; assets are never replaced." \
            || echo "release exists, uploading into it"
          gh release upload "$tag" python/wheelhouse/*.whl --clobber
