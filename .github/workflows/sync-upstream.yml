name: sync upstream

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aarch64-cuda
          fetch-depth: 0

      - name: Merge upstream master
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/OpenNMT/CTranslate2.git
          git fetch upstream master

          before=$(python3 -c "exec(open('python/ctranslate2/version.py').read()); print(__version__)")
          echo "before=$before" >> "$GITHUB_OUTPUT"

          if ! git merge --no-edit upstream/master; then
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          after=$(python3 -c "exec(open('python/ctranslate2/version.py').read()); print(__version__)")
          echo "after=$after" >> "$GITHUB_OUTPUT"
          git push origin aarch64-cuda

      - name: Open issue on conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Upstream merge conflict on aarch64-cuda" \
            --body "The weekly upstream merge hit a conflict and was aborted. Resolve by hand, then rerun the aarch64 CUDA wheel workflow."

      - name: Build wheel for new upstream version
        if: steps.merge.outputs.conflict != 'true' && steps.merge.outputs.after != steps.merge.outputs.before
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "version ${{ steps.merge.outputs.before }} -> ${{ steps.merge.outputs.after }}"
          gh workflow run aarch64-cuda-wheel.yml --ref aarch64-cuda
