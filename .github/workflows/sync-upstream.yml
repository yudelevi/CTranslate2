name: sync upstream

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aarch64-cuda
          fetch-depth: 0

      - name: Merge upstream master
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/OpenNMT/CTranslate2.git
          git fetch upstream master

          before=$(python3 -c "exec(open('python/ctranslate2/version.py').read()); print(__version__)")
          echo "before=$before" >> "$GITHUB_OUTPUT"

          if ! git merge --no-commit --no-edit upstream/master; then
            # A failed merge without MERGE_HEAD is an operational error, not a conflict.
            if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              echo "::error::Upstream merge failed before a merge could be prepared."
              exit 1
            fi
          fi

          # This fork deliberately drops upstream workflows (their publish jobs), and
          # GITHUB_TOKEN cannot push workflow changes, so keep only workflows we own.
          comm -13 \
            <(git ls-tree --name-only HEAD .github/workflows/ | LC_ALL=C sort) \
            <(git ls-files .github/workflows/ | LC_ALL=C sort -u) \
            | xargs -r git rm -q -f --

          if [[ -n $(git diff --name-only --diff-filter=U) ]]; then
            echo "::error::Upstream merge has conflicts that require manual resolution:"
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          fi

          after=$(python3 -c "exec(open('python/ctranslate2/version.py').read()); print(__version__)")
          echo "after=$after" >> "$GITHUB_OUTPUT"
          git push origin aarch64-cuda

      - name: Build wheel for new upstream version
        if: steps.merge.outputs.after != steps.merge.outputs.before
        env:
          GH_TOKEN: ${{ github.token }}
          # gh picks the upstream remote added above unless the repo is pinned.
          GH_REPO: ${{ github.repository }}
        run: |
          echo "version ${{ steps.merge.outputs.before }} -> ${{ steps.merge.outputs.after }}"
          gh workflow run aarch64-cuda-wheel.yml --ref aarch64-cuda
